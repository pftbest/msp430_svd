# The DCO ranges up to 16 MHz, of the devices without the enhanced clock system: 20 MHz and 24 MHz are
# "available in enhanced clock system only" (DCORSEL: SLAU445I Table 3-5, p. 114), and the data sheets end
# at 16 MHz (SLASE59F Table 5-6, p. 24; SLASEO7C 8.12.3.3, p. 28; SLASEE4C Table 5-6, p. 26)
CS:
  CSCTL1:
    DCORSEL:
      _replace_enum:
        RANGE_1MHZ: [0, "1 MHz"]
        RANGE_2MHZ: [1, "2 MHz"]
        RANGE_4MHZ: [2, "4 MHz"]
        RANGE_8MHZ: [3, "8 MHz"]
        RANGE_12MHZ: [4, "12 MHz"]
        RANGE_16MHZ: [5, "16 MHz"]
