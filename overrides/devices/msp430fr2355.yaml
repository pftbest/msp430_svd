   - "../peripherals/usci_a0_spi_ucbusy.yaml"
   - "../peripherals/usci_a1_spi_ucbusy.yaml"
   - "../peripherals/usci_b0_spi_ucbusy.yaml"
   - "../peripherals/usci_b1_spi_ucbusy.yaml"
   - "../peripherals/pmmctl_pmmpw_enum.yaml"
   - "../peripherals/pmmctl0_h.yaml"
   - "../peripherals/pmmctl0_svshe_enum.yaml"
   - "../peripherals/frctl.yaml"
   - "../peripherals/wdt_a_wdtpw_enum.yaml"
   - "../peripherals/sys_frwppw_enum.yaml"
   - "../peripherals/sys_tbxtrgsel.yaml"
   - "../peripherals/sfr_sysflte.yaml"
   - "../peripherals/crc.yaml"
   - "../peripherals/cs_write_constraints.yaml"
   - "../peripherals/icc.yaml"
   - "../peripherals/tlv_enhanced_ref.yaml"
   - "../peripherals/tlv_dco_tap_24mhz.yaml"
   - "../peripherals/cs_fllrefdiv_enhanced.yaml"
   - "../peripherals/adc_enums.yaml"
   - "../peripherals/sys_irmsel_enum.yaml"
   - "../peripherals/cs_fll_enums.yaml"
   - "../peripherals/sys_sysctl_sysbslc_enums.yaml"
   - "../peripherals/undocumented_fields.yaml"
   - "../peripherals/sac_saciv.yaml"
   - "../peripherals/sys_iv_enums.yaml"
   - "../peripherals/adc_adcres_12bit.yaml"
   - "../peripherals/cs_dcorsel_enhanced.yaml"
   - "../peripherals/pmm_refvsel_enhanced_ref.yaml"

# The device file has port J, the Capacitive Touch I/O and interrupt registers for ports P5 and P6,
# which the data sheet doesn't list (SLASEC4D Table 6-33, peripheral file map, and Table 6-43, Port P5,
# P6 registers)
_delete:
  - PJ
  - CAPTIO

# The backup memory is BAKMEM in the user's guide (SLAU445I 7, p. 309; SLAU445I Table 7-1, p. 310) and in
# the data sheet (SLASEC4D Table 6-54, p. 92)
_modify:
  BKMEM:
    name: BAKMEM
    description: BAKMEM

P5:
  _delete:
    - P5IES
    - P5IE
    - P5IFG
    - P5IV

P6:
  _delete:
    - P6IES
    - P6IE
    - P6IFG
    - P6IV

# The PxIV interrupt vector fields cover the whole register, and their values have the same names on every
# port (SLAU445I Table 8-5 to Table 8-8, p. 332 to p. 333)
"P1,P2,P3,P4":
  "P?IV":
    _modify:
      "P?IV":
        bitWidth: 16
    "P?IV":
      _replace_enum:
        NONE: [0x00, "No interrupt pending"]
        IFG0: [0x02, "Interrupt Source: Port x.0 interrupt; Interrupt Flag: PxIFG.0; Interrupt Priority: Highest"]
        IFG1: [0x04, "Interrupt Source: Port x.1 interrupt; Interrupt Flag: PxIFG.1"]
        IFG2: [0x06, "Interrupt Source: Port x.2 interrupt; Interrupt Flag: PxIFG.2"]
        IFG3: [0x08, "Interrupt Source: Port x.3 interrupt; Interrupt Flag: PxIFG.3"]
        IFG4: [0x0A, "Interrupt Source: Port x.4 interrupt; Interrupt Flag: PxIFG.4"]
        IFG5: [0x0C, "Interrupt Source: Port x.5 interrupt; Interrupt Flag: PxIFG.5"]
        IFG6: [0x0E, "Interrupt Source: Port x.6 interrupt; Interrupt Flag: PxIFG.6"]
        IFG7: [0x10, "Interrupt Source: Port x.7 interrupt; Interrupt Flag: PxIFG.7; Interrupt Priority: Lowest"]

# SYNCSEL, the CapTIvate trigger selection, isn't in SYSCFG1 of the Smart Analog Combo devices (SLAU445I
# Table 1-25, p. 76), and the data sheet doesn't name it
SYS:
  SYSCFG1:
    _delete:
      - SYNCSEL

ADC:
  ADCCTL1:
    # The trigger sources of ADCSHS (ADC Trigger Signal Connections: SLASEC4D Table 6-22, p. 77)
    ADCSHS:
      _replace_enum:
        SOFTWARE: [0, "ADCSC bit (software trigger)"]
        RTC: [1, "RTC event"]
        TIMER: [2, "TB1.1B"]
        COMPARATOR: [3, "eCOMP0 COUT"]

# The LPM3.5 switch is only on other devices (LPM5SM, LPM5SW: "Only available in the FR203x, FR211x, FR2100,
# FR2000, FR231x, FR2433, FR2422, FR263x, FR253x, FR252x, and FR413x devices", SLAU445I Table 2-7), and
# FRLPMPWR reads as 0 on these 24-MHz devices (SLAU445I Figure 6-5 and Table 6-3)
PMM:
  PM5CTL0:
    _delete:
      - LPM5SM
      - LPM5SW

FRCTL:
  GCCTL0:
    _modify:
      FRLPMPWR:
        access: read-only
