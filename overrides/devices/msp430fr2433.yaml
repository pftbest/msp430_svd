          _replace_enum:
            "RISING": [0, "NMI on rising edge"]
            "FALLING": [1, "NMI on falling edge"]
        SYSRSTUP:
          _replace_enum:
            "PULLDOWN": [0, "Pulldown is selected"]
            "PULLUP": [1, "Pullup is selected"]
