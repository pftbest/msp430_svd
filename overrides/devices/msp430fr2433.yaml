_svd: ../../msp430fr2433.svd

_include:
   - "../peripherals/port_1_2_pxseln.yaml"
   - "../peripherals/pmmctl.yaml"
   - "../peripherals/pmmctl0_h.yaml"
   - "../peripherals/frctl.yaml"
   - "../peripherals/sfr_sysflte.yaml"
   - "../peripherals/crc.yaml"
   - "../peripherals/cs_write_constraints.yaml"
   - "../peripherals/tlv_basic_ref.yaml"
   - "../peripherals/adc_enums.yaml"
   - "../peripherals/sys_irmsel_enum.yaml"
   - "../peripherals/cs_fll_enums.yaml"
   - "../peripherals/sys_sysctl_sysbslc_enums.yaml"
   - "../peripherals/pmm_lpm5_switch_enums.yaml"
   - "../peripherals/sys_iv_enums.yaml"
   - "../peripherals/adc_adcres_10bit.yaml"
   - "../peripherals/cs_dcorsel_basic.yaml"
   - "../peripherals/pmm_refvsel_basic_ref.yaml"

# The SPI mode registers move into the eUSCI peripherals below, as on the other devices. PORT_1_2 has the
# registers of P1 and P2 (from port_1_2_pxseln.yaml) again, with a field per bit, which the user's guide
# doesn't have (PxIN and so on are one field: SLAU445I Table 8-9 to Table 8-18, p. 334 to p. 337), and
# MPY_32's registers move into MPY32 below.
_delete:
   - USCI_A0_SPI_MODE
   - USCI_A1_SPI_MODE
   - USCI_B0_SPI_MODE
   - PORT_1_2
   - MPY_32

# Rename to match user guide, and the peripheral names of the other MSP430FR2xx devices
_modify:
    PORT_3:
        name: P3
    FRAM:
        name: FRCTL
        description: FRCTL
    CRC16:
        name: CRC
        description: CRC
    WATCHDOG_TIMER:
        name: WDT_A
        description: WDT_A
    REAL_TIME_CLOCK:
        name: RTC
        description: RTC
    # BAKMEM: SLAU445I 7, p. 309; SLAU445I Table 7-1, p. 310; SLASE59F Table 6-43, p. 68
    BACKUP_MEMORY:
        name: BAKMEM
        description: BAKMEM
    # One MPY32, as in the user's guide (SLAU445I Table 16-7, p. 438) and the data sheet (SLASE59F
    # Table 6-39, p. 66: "MPY32 Registers (Base Address: 04C0h)"), instead of MPY_16 and MPY_32
    MPY_16:
        name: MPY32
        description: MPY32
    TIMER_0_A3:
        name: TA0
        description: TA0
    TIMER_1_A3:
        name: TA1
        description: TA1
    TIMER_2_A2:
        name: TA2
        description: TA2
    TIMER_3_A2:
        name: TA3
        description: TA3
    USCI_A0_UART_MODE:
        name: E_USCI_A0
        description: eUSCI_A0
    USCI_A1_UART_MODE:
        name: E_USCI_A1
        description: eUSCI_A1
    USCI_B0_I2C_MODE:
        name: E_USCI_B0
        description: eUSCI_B0

WDT_A:
    WDTCTL:
        # Add missing password field
        _add:
            WDTPW:
                description: Watchdog Timer Password
                bitOffset: 8
                bitWidth: 8
        WDTPW:
            _read:
                PASSWORD: [0x69, "Value always read from the Watchdog Password field"]
            _write:
                PASSWORD: [0x5A, "Value which must be written to the Watchdog Password field"]
        # More descriptive enum variants
        WDTSSEL:
            _replace_enum:
                SMCLK:  [0, "WDT - Timer Clock Source Select: SMCLK"]
                ACLK:   [1, "WDT - Timer Clock Source Select: ACLK"]
                VLOCLK: [2, "WDT - Timer Clock Source Select: VLOCLK"]
                BCLK:   [3, "WDT - Timer Clock Source Select: Reserved"]
        WDTHOLD:
            UNHOLD: [0, "Watchdog timer is not stopped"]
            HOLD:   [1, "Watchdog timer is stopped"]
        # Named as on the other devices
        WDTIS:
          _replace_enum:
            "/2G": [0, "Watchdog clock source / (2^(31)) (18:12:16 at 32.768 kHz)"]
            "/128M": [1, "Watchdog clock source /(2^(27)) (01:08:16 at 32.768 kHz)"]
            "/8192K": [2, "Watchdog clock source /(2^(23)) (00:04:16 at 32.768 kHz)"]
            "/512K": [3, "Watchdog clock source /(2^(19)) (00:00:16 at 32.768 kHz)"]
            "/32K": [4, "Watchdog clock source /(2^(15)) (1 s at 32.768 kHz)"]
            "/8192": [5, "Watchdog clock source / (2^(13)) (250 ms at 32.768 kHz)"]
            "/512": [6, "Watchdog clock source / (2^(9)) (15.625 ms at 32.768 kHz)"]
            "/64": [7, "Watchdog clock source / (2^(6)) (1.95 ms at 32.768 kHz)"]

RTC:
    RTCCTL:
        RTCSS:
            _replace_enum:
                DISABLED: [0, "Low-Power-Counter Clock Source Select: Disabled"]
                SMCLK:    [1, "Low-Power-Counter Clock Source Select: SMCLK"]
                XT1CLK:   [2, "Low-Power-Counter Clock Source Select: XT1CLK"]
                VLOCLK:   [3, "Low-Power-Counter Clock Source Select: VLOCLK"]
        RTCPS:
            _replace_enum:
                /1:    [0, "RTC Predivider /1"]
                /10:   [1, "RTC Predivider /10"]
                /100:  [2, "RTC Predivider /100"]
                /1000: [3, "RTC Predivider /1000"]
                /16:   [4, "RTC Predivider /16"]
                /64:   [5, "RTC Predivider /64"]
                /256:  [6, "RTC Predivider /256"]
                /1024: [7, "RTC Predivider /1024"]
        _modify:
            RTCIF:
                name: RTCIFG  # Match user guide name

CS:
    # One DCO tap and one modulation field, as on the other devices
    CSCTL0:
        _merge:
            - "DCO*"
            - "MOD*"
    CSCTL1:
        _clear:
            - DCOFTRIM
    CSCTL2:
        _merge:
          - "FLLN*"
        FLLD:
          _replace_enum:
            "/1": [0, "fDCOCLK / 1"]
            "/2": [1, "fDCOCLK / 2"]
            "/4": [2, "fDCOCLK / 4"]
            "/8": [3, "fDCOCLK / 8"]
            "/16": [4, "fDCOCLK / 16"]
            "/32": [5, "fDCOCLK / 32"]
            "FLLD_6": [6, "fDCOCLK / 40(Only avaliable in 24MHz clock system)"]
            "FLLD_7": [7, "fDCOCLK / 48(Only avaliable in 24MHz clock system)"]
    CSCTL3:
        SELREF:
            _replace_enum:
                XT1CLK:   [0, "XT1CLK"]
                REFOCLK:  [1, "REFOCLK"]
                SELREF_2: [2, "Reserved"]
                SELREF_3: [3, "Reserved"]
        FLLREFDIV:
          _replace_enum:
            "/1": [0, "fFLLREFCLK / 1"]
            "/32": [1, "fFLLREFCLK / 32"]
            "/64": [2, "fFLLREFCLK / 64"]
            "/128": [3, "fFLLREFCLK / 128"]
            "/256": [4, "fFLLREFCLK / 256"]
            "/512": [5, "fFLLREFCLK / 512"]
            "FLLREFDIV_6": [6, "fFLLREFCLK / 640 (only available in 24MHz clock system)"]
            "FLLREFDIV_7": [7, "fFLLREFCLK / 768(only available in 24MHz clock system)"]
    CSCTL4:
        SELMS:
            _replace_enum:
                DCOCLKDIV: [0, "DCO CLKDIV"]
                REFOCLK:   [1, "REFOCLK"]
                XT1CLK:    [2, "XT1CLK"]
                VLOCLK:    [3, "VLOCLK"]
        SELA:
            XT1CLK:  [0, "Source ACLK from XT1CLK with divider (no more than 40kHz)"]
            REFOCLK: [1, "Source ACLK from the internal 32kHz clock source"]
    CSCTL5:
        DIVM:
            _replace_enum:
                /1:   [0, "MCLK = Clock source /1"]
                /2:   [1, "MCLK = Clock source /2"]
                /4:   [2, "MCLK = Clock source /4"]
                /8:   [3, "MCLK = Clock source /8"]
                /16:  [4, "MCLK = Clock source /16"]
                /32:  [5, "MCLK = Clock source /32"]
                /64:  [6, "MCLK = Clock source /64"]
                /128: [7, "MCLK = Clock source /128"]
        DIVS:
            _replace_enum:
                /1:   [0, "SMCLK = MCLK /1"]
                /2:   [1, "SMCLK = MCLK /2"]
                /4:   [2, "SMCLK = MCLK /4"]
                /8:   [3, "SMCLK = MCLK /8"]

PMM:
    PMMCTL0:
        SVSHE:
            DISABLED: [0, "High-side SVS (SVSH) is disabled in LPM2, LPM3, LPM4, LPM3.5, and LPM4.5. SVSH is always enabled in active mode, LPM0, and LPM1."]
            ENABLED:  [1, "SVSH is always enabled."]

FRCTL:
    # ACCTEIE isn't in GCCTL0 (SLAU445I Table 6-3, p. 307), and the data sheet doesn't name it
    GCCTL0:
        _delete:
            - ACCTEIE
    FRCTL0:
        # Add missing password field (its values are in frctl.yaml)
        _add:
            FRCTLPW:
                description: FRCTLPW Password
                bitOffset: 8
                bitWidth: 8

P3:
    # One field per register, named as in the user's guide (PxIN, PxOUT, PxDIR, PxREN, PxSEL0 and PxSEL1:
    # SLAU445I Table 8-9 to Table 8-14, p. 334 to p. 335), as P1 and P2 have, instead of one per bit
    P3IN:
        _merge:
            P3IN: "P3IN?"
    P3OUT:
        _merge:
            P3OUT: "P3OUT?"
    P3DIR:
        _merge:
            P3DIR: "P3DIR?"
    P3REN:
        _merge:
            P3REN: "P3REN?"
    P3SEL0:
        _merge:
            P3SEL0: "P3SEL0_?"
    P3SEL1:
        _merge:
            P3SEL1: "P3SEL1_?"
    _add:
        P3SELC:
          size: 8
          addressOffset: 22
          description: Port 3 Complement Select register
          fields:
            P3SELC:
              description: P3SELC
              bitOffset: 0
              bitWidth: 8
              _write_constraint: [0, 0xff]

# Named as on the other devices
"TA?":
    "TA?CTL":
        ID:
          _replace_enum:
            "/1": [0, "/1"]
            "/2": [1, "/2"]
            "/4": [2, "/4"]
            "/8": [3, "/8"]
        MC:
          _replace_enum:
            "STOP": [0, "Stop mode: Timer is halted"]
            "UP": [1, "Up mode: Timer counts up to TAxCCR0"]
            "CONTINUOUS": [2, "Continuous mode: Timer counts up to 0FFFFh"]
            "UPDOWN": [3, "Up/down mode: Timer counts up to TAxCCR0 then down to 0000h"]
        TASSEL:
          _replace_enum:
            "TACLK": [0, "TAxCLK"]
            "ACLK": [1, "ACLK"]
            "SMCLK": [2, "SMCLK"]
            "INCLK": [3, "INCLK"]
    "TA?CCTL?":
        CCIS:
          _replace_enum:
            "CCIA": [0, "CCIxA"]
            "CCIB": [1, "CCIxB"]
            "GND": [2, "GND"]
            "VCC": [3, "VCC"]
        CM:
          _replace_enum:
            "NONE": [0, "No capture"]
            "RISING": [1, "Capture on rising edge"]
            "FALLING": [2, "Capture on falling edge"]
            "BOTH": [3, "Capture on both rising and falling edges"]
    # The device file's TAxIV registers have no field (TAIV: SLAU445I Table 13-8, p. 388)
    "TA?IV":
        _add:
            TAIV:
                description: Timer_A interrupt vector value
                bitOffset: 0
                bitWidth: 16
                access: read-only
        TAIV:
          _replace_enum:
            NONE: [0x00, "No interrupt pending"]
            TACCR1: [0x02, "Interrupt Source: Capture/compare 1; Interrupt Flag: TAxCCR1 CCIFG; Interrupt Priority: Highest"]
            TACCR2: [0x04, "Interrupt Source: Capture/compare 2; Interrupt Flag: TAxCCR2 CCIFG"]
            TACCR3: [0x06, "Interrupt Source: Capture/compare 3; Interrupt Flag: TAxCCR3 CCIFG"]
            TACCR4: [0x08, "Interrupt Source: Capture/compare 4; Interrupt Flag: TAxCCR4 CCIFG"]
            TACCR5: [0x0A, "Interrupt Source: Capture/compare 5; Interrupt Flag: TAxCCR5 CCIFG"]
            TACCR6: [0x0C, "Interrupt Source: Capture/compare 6; Interrupt Flag: TAxCCR6 CCIFG"]
            TAIFG: [0x0E, "Interrupt Source: Timer overflow; Interrupt Flag: TAxCTL TAIFG; Interrupt Priority: Lowest"]
    "TA?EX0":
        TAIDEX:
          _replace_enum:
            "/1": [0, "Divide by 1"]
            "/2": [1, "Divide by 2"]
            "/3": [2, "Divide by 3"]
            "/4": [3, "Divide by 4"]
            "/5": [4, "Divide by 5"]
            "/6": [5, "Divide by 6"]
            "/7": [6, "Divide by 7"]
            "/8": [7, "Divide by 8"]

ADC:
    ADCCTL1:
        # The trigger sources of ADCSHS (ADC Trigger Signal Connections: SLASE59F Table 6-16, p. 53; 11b
        # isn't connected)
        ADCSHS:
          _replace_enum:
            SOFTWARE: [0, "ADCSC bit (software trigger)"]
            RTC: [1, "RTC event"]
            TIMER: [2, "TA1.1B"]
    # The device file's ADCIV register has no field (ADCIV: SLAU445I Table 21-15, p. 572)
    ADCIV:
        _add:
            ADCIV:
                description: ADC interrupt vector value
                bitOffset: 0
                bitWidth: 16
                access: read-write

# The registers of the device file's MPY_32, at their offsets from 04C0h (SLAU445I Table 16-7, p. 438)
MPY32:
    _add:
        MPY32L:
            description: 32-bit operand 1 - multiply - low word
            addressOffset: 0x10
            size: 16
        MPY32H:
            description: 32-bit operand 1 - multiply - high word
            addressOffset: 0x12
            size: 16
        MPYS32L:
            description: 32-bit operand 1 - signed multiply - low word
            addressOffset: 0x14
            size: 16
        MPYS32H:
            description: 32-bit operand 1 - signed multiply - high word
            addressOffset: 0x16
            size: 16
        MAC32L:
            description: 32-bit operand 1 - multiply accumulate - low word
            addressOffset: 0x18
            size: 16
        MAC32H:
            description: 32-bit operand 1 - multiply accumulate - high word
            addressOffset: 0x1A
            size: 16
        MACS32L:
            description: 32-bit operand 1 - signed multiply accumulate - low word
            addressOffset: 0x1C
            size: 16
        MACS32H:
            description: 32-bit operand 1 - signed multiply accumulate - high word
            addressOffset: 0x1E
            size: 16
        OP2L:
            description: 32-bit operand 2 - low word
            addressOffset: 0x20
            size: 16
        OP2H:
            description: 32-bit operand 2 - high word
            addressOffset: 0x22
            size: 16
        RES0:
            description: 32x32-bit result 0 - least significant word
            addressOffset: 0x24
            size: 16
        RES1:
            description: 32x32-bit result 1
            addressOffset: 0x26
            size: 16
        RES2:
            description: 32x32-bit result 2
            addressOffset: 0x28
            size: 16
        RES3:
            description: 32x32-bit result 3 - most significant word
            addressOffset: 0x2A
            size: 16
    MPY32CTL0:
        # MPYOP1_32 and MPYOP2_32 (SLAU445I Table 16-9, p. 440)
        _modify:
            OP1_32:
                name: MPYOP1_32
            OP2_32:
                name: MPYOP2_32
        MPYM:
          _replace_enum:
            "MPY": [0, "MPY  Multiply"]
            "MPYS": [1, "MPYS  Signed multiply"]
            "MAC": [2, "MAC  Multiply accumulate"]
            "MACS": [3, "MACS  Signed multiply accumulate"]

# Combine UCAxCTL0/1 into UCAxCTLW0 and UCAxBR0/1 into UCAxBRW, and merge the UART and SPI mode
# peripherals into one, as on the other devices
E_USCI_A0:
    # The byte views of the word registers, and the two IrDA control bytes, which are UCA0IRCTL on the
    # other devices
    _delete:
        - UCA0CTL0
        - UCA0CTL1
        - UCA0BR0
        - UCA0BR1
        - UCA0IRTCTL
        - UCA0IRRCTL
    _modify:
        UCA0STATW:
            size: 16
            resetMask: 65535
        UCA0ABCTL:
            size: 16
            resetMask: 65535
    UCA0MCTLW:
        _merge:
            - "UCBRS*"
    UCA0STATW:
        _modify:
            UCADDR:
                name: UCADDR_UCIDLE
                description: Address received / Idle line detected
    UCA0ABCTL:
        _merge:
            UCDELIM: [UCDELIM0, UCDELIM1]
    _add:
        UCA0CTLW0:
            description: eUSCI_Ax Control Word Register 0
            addressOffset: 0
            size: 16
            fields:
                UCSWRST:
                    description: Software reset enable
                    bitOffset: 0
                    bitWidth: 1
                    access: read-write
                UCTXBRK:
                    description: Transmit break
                    bitOffset: 1
                    bitWidth: 1
                    access: read-write
                UCTXADDR:
                    description: Transmit address
                    bitOffset: 2
                    bitWidth: 1
                    access: read-write
                UCDORM:
                    description: Dormant
                    bitOffset: 3
                    bitWidth: 1
                    access: read-write
                UCBRKIE:
                    description: Receive break character interrupt enable
                    bitOffset: 4
                    bitWidth: 1
                    access: read-write
                UCRXEIE:
                    description: Receive erroneous-character interrupt enable
                    bitOffset: 5
                    bitWidth: 1
                    access: read-write
                UCSSEL:
                    description: eUSCI_A clock source select
                    bitOffset: 6
                    bitWidth: 2
                    access: read-write
                UCSYNC:
                    description: Synchronous mode enable
                    bitOffset: 8
                    bitWidth: 1
                    access: read-write
                UCMODE:
                    description: eUSCI_A mode
                    bitOffset: 9
                    bitWidth: 2
                    access: read-write
                UCSPB:
                    description: Stop bit select
                    bitOffset: 11
                    bitWidth: 1
                    access: read-write
                UC7BIT:
                    description: Character length
                    bitOffset: 12
                    bitWidth: 1
                    access: read-write
                UCMSB:
                    description: MSB first select
                    bitOffset: 13
                    bitWidth: 1
                    access: read-write
                UCPAR:
                    description: Parity select
                    bitOffset: 14
                    bitWidth: 1
                    access: read-write
                UCPEN:
                    description: Parity enable
                    bitOffset: 15
                    bitWidth: 1
                    access: read-write
        UCA0BRW:
            description: eUSCI_Ax Baud Rate Control Word Register
            addressOffset: 6
            size: 16
        # Add missing registers (sometimes only present in one mode or the other)
        UCA0IE:
            size: 16
            addressOffset: 26
            description: eUSCI_A0 Interrupt Enable Register
            fields:
                UCRXIE:
                    description: Receive interrupt enable
                    bitOffset: 0
                    bitWidth: 1
                    access: read-write
                UCTXIE:
                    description: Transmit interrupt enable
                    bitOffset: 1
                    bitWidth: 1
                    access: read-write
                UCSTTIE:
                    description: Start bit interrupt enable
                    bitOffset: 2
                    bitWidth: 1
                    access: read-write
                UCTXCPTIE:
                    description: Transmit complete interrupt enable
                    bitOffset: 3
                    bitWidth: 1
                    access: read-write
        UCA0IFG:
            size: 16
            addressOffset: 28
            description: eUSCI_A0 Interrupt Flag Register
            fields:
                UCRXIFG:
                    bitOffset: 0
                    bitWidth: 1
                    access: read-write
                    description: Receive interrupt flag. Is set when RXBUF has received a complete character
                UCTXIFG:
                    bitOffset: 1
                    bitWidth: 1
                    access: read-write
                    description: Transmit interrupt flag. Is set when TXBUF is empty.
                UCSTTIFG:
                    bitOffset: 2
                    bitWidth: 1
                    access: read-write
                    description: Start bit interrupt flag
                UCTXCPTIFG:
                    bitOffset: 3
                    bitWidth: 1
                    access: read-write
                    description: Transmit complete interrupt flag
        UCA0IRCTL:
          description: "eUSCI_Ax IrDA Control Word Register"
          addressOffset: 18
          size: 16
          fields:
            UCIREN:
              description: "IrDA encoder/decoder enable"
              bitOffset: 0
              bitWidth: 1
              access: read-write
            UCIRTXCLK:
              description: "IrDA transmit pulse clock select"
              bitOffset: 1
              bitWidth: 1
              access: read-write
            UCIRTXPL:
              description: "Transmit pulse length"
              bitOffset: 2
              bitWidth: 6
              access: read-write
            UCIRRXFE:
              description: "IrDA receive filter enabled"
              bitOffset: 8
              bitWidth: 1
              access: read-write
            UCIRRXPL:
              description: "IrDA receive input UCAxRXD polarity"
              bitOffset: 9
              bitWidth: 1
              access: read-write
            UCIRRXFL:
              description: "Receive filter length"
              bitOffset: 10
              bitWidth: 6
              access: read-write
        # The SPI mode registers, from the former USCI_A0_SPI_MODE peripheral
        UCA0CTLW0_SPI:
          description: "eUSCI_A0 Control Word Register 0"
          addressOffset: 0
          size: 16
          fields:
            UCSWRST:
              description: "Software reset enable"
              bitOffset: 0
              bitWidth: 1
              access: read-write
            UCSTEM:
              description: "STE mode select in master mode."
              bitOffset: 1
              bitWidth: 1
              access: read-write
            UCSSEL:
              description: "eUSCI_A clock source select"
              bitOffset: 6
              bitWidth: 2
              access: read-write
            UCSYNC:
              description: "Synchronous mode enable"
              bitOffset: 8
              bitWidth: 1
              access: read-write
            UCMODE:
              description: "eUSCI_A mode"
              bitOffset: 9
              bitWidth: 2
              access: read-write
            UCMST:
              description: "Master mode select"
              bitOffset: 11
              bitWidth: 1
              access: read-write
            UC7BIT:
              description: "Character length"
              bitOffset: 12
              bitWidth: 1
              access: read-write
            UCMSB:
              description: "MSB first select"
              bitOffset: 13
              bitWidth: 1
              access: read-write
            UCCKPL:
              description: "Clock polarity select"
              bitOffset: 14
              bitWidth: 1
              access: read-write
            UCCKPH:
              description: "Clock phase select"
              bitOffset: 15
              bitWidth: 1
              access: read-write
        UCA0BRW_SPI:
          description: "eUSCI_A0 Bit Rate Control Register"
          addressOffset: 6
          size: 16
        UCA0STATW_SPI:
          description: "USCI A0 Status Register"
          addressOffset: 10
          size: 16
          fields:
            UCBUSY:
              description: "USCI Busy Flag"
              bitOffset: 0
              bitWidth: 1
              access: read-write
            UCOE:
              description: "USCI Overrun Error Flag"
              bitOffset: 5
              bitWidth: 1
              access: read-write
            UCFE:
              description: "USCI Frame Error Flag"
              bitOffset: 6
              bitWidth: 1
              access: read-write
            UCLISTEN:
              description: "USCI Listen mode"
              bitOffset: 7
              bitWidth: 1
              access: read-write
        UCA0RXBUF_SPI:
          description: "USCI A0 Receive Buffer"
          addressOffset: 12
          size: 16
          fields:
            UCRXBUF:
              description: "Receive data buffer"
              bitOffset: 0
              bitWidth: 8
              access: read-write
        UCA0TXBUF_SPI:
          description: "USCI A0 Transmit Buffer"
          addressOffset: 14
          size: 16
          fields:
            UCTXBUF:
              description: "Transmit data buffer"
              bitOffset: 0
              bitWidth: 8
              access: read-write
        UCA0IE_SPI:
          description: "USCI A0 Interrupt Enable Register"
          addressOffset: 26
          size: 16
          fields:
            UCRXIE:
              description: "USCI Receive Interrupt Enable"
              bitOffset: 0
              bitWidth: 1
              access: read-write
            UCTXIE:
              description: "USCI Transmit Interrupt Enable"
              bitOffset: 1
              bitWidth: 1
              access: read-write
        UCA0IFG_SPI:
          description: "USCI A0 Interrupt Flags Register"
          addressOffset: 28
          size: 16
          fields:
            UCRXIFG:
              description: "SPI Receive Interrupt Flag"
              bitOffset: 0
              bitWidth: 1
              access: read-write
            UCTXIFG:
              description: "SPI Transmit Interrupt Flag"
              bitOffset: 1
              bitWidth: 1
              access: read-write
        UCA0IV_SPI:
          description: "USCI A0 Interrupt Vector Register"
          addressOffset: 30
          size: 16
