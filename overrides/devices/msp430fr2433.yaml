# Add missing password field, and the fields of the interrupt vector registers, which the device file's
# registers lack (SYSUNIV, SYSSNIV, SYSRSTIV: SLAU445I Table 1-20, p. 71; SLAU445I Table 1-21, p. 71;
# SLAU445I Table 1-22, p. 72)
SYS:
    SYSUNIV:
        _add:
            SYSUNIV:
                description: User NMI vector
                bitOffset: 0
                bitWidth: 16
                access: read-only
    SYSSNIV:
        _add:
            SYSSNIV:
                description: System NMI vector
                bitOffset: 0
                bitWidth: 16
                access: read-only
    SYSRSTIV:
        _add:
            SYSRSTIV:
                description: Reset interrupt vector
                bitOffset: 0
                bitWidth: 16
                access: read-only
    SYSCFG0:
        _add:
            FRWPPW:
                description: FRAM protection password
                bitOffset: 8
                bitWidth: 8
                access: read-write
            FRWPOA:
                description: Program FRAM Write Protection Offset
                bitOffset: 2
                bitWidth: 6
                access: read-write
        FRWPPW:
            _read:
                PASSWORD: [0x96, "Value always read from the SYSCFG0 password field"]
            _write:
                PASSWORD: [0xA5, "Value which must be written to the SYSCFG0 password field"]

